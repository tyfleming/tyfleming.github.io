<svg xmlns="http://www.w3.org/2000/svg" width="740" height="300" viewBox="0 0 740 300" role="img" aria-labelledby="title desc">
<title id="title">Worked example of parcel mean removal and residual projection</title>
<desc id="desc">Illustrative arithmetic with three volumes and four parcels. The rows of X are parcel values, m is each row mean, E contains X minus its row mean, U is a two-column zero-sum orthonormal basis, and A equals E times U. The example sets the training residual mean to zero. The actual Default network uses 41 parcels and a fold-fitted basis shown in Figure 02.2.</desc>
