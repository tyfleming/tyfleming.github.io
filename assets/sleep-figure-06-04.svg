<text x="560.00" y="223.00" fill="#6b7380" font-size="10" font-weight="400" text-anchor="middle" font-family="'SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">100%</text>
<text x="740.00" y="68.00" fill="#6b7380" font-size="10" font-weight="500" text-anchor="end" font-family="'SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">raw → calibrated</text>
