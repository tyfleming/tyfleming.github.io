<text x="219.75" y="25.50" fill="#6b7380" font-size="10" font-weight="500" text-anchor="start" font-family="'SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">saved</text>
<line x1="80.00" y1="74.00" x2="80.00" y2="208.00" stroke="#c9ced5" stroke-width="1" opacity="1" stroke-linecap="butt"/>
