<svg xmlns="http://www.w3.org/2000/svg" width="760" height="238" viewBox="0 0 760 238" role="img" aria-labelledby="title desc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif">
<title id="title">Cycle branch before and after calibration</title>
<desc id="desc">The same representative held-out window has saved raw and calibrated Wake, N1, N2, and N3 cycle-branch probabilities on one axis. The fitted cycle temperature is 0.888, which modestly sharpens these probabilities.</desc>
