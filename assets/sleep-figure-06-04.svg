<circle cx="136.94" cy="46.00" r="4.50" fill="#6b7380"/>
<text x="147.44" y="50.00" fill="#3a414b" font-size="11.5" font-weight="400" text-anchor="start">calibrated · T = 0.888</text>
<text x="740.00" y="50.00" fill="#6b7380" font-size="11" font-weight="400" text-anchor="end">T = 0.888 modestly sharpens these probabilities</text>
