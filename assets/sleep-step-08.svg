<svg xmlns="http://www.w3.org/2000/svg" width="740" height="300" viewBox="0 0 740 300" role="img" aria-labelledby="title desc">
<title id="title">Four probabilities locate one simplex point</title>
<desc id="desc">Four saved final stage probabilities combine with the tetrahedron vertices to locate one held-out point. The probability bars and position represent the same vector.</desc>
