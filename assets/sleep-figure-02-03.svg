<svg xmlns="http://www.w3.org/2000/svg" width="740" height="300" viewBox="0 0 740 300" role="img" aria-labelledby="title desc">
<title id="title">One volume becomes one PCA point</title>
<desc id="desc">Illustrative PCA projection for volume one only. Its centered parcel residuals are [2, 2, minus 2, minus 2]. The fitted PC1 weights are [0.5, 0.5, minus 0.5, minus 0.5], giving score 4. The fitted PC2 weights are [0.5, minus 0.5, 0.5, minus 0.5], giving score zero. One point at horizontal PC1 coordinate 4 and vertical PC2 coordinate zero represents this one volume; the other three training volumes are intentionally omitted.</desc>
<rect width="740" height="300" fill="#ffffff"/>
<text x="24.00" y="27.00" fill="#235969" font-size="11" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">FIGURE 02.3 / ONE VOLUME → ONE POINT</text>
<text x="716.00" y="27.00" fill="#5a6669" font-size="11" font-weight="400" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">illustrative · fitted weights stay fixed</text>
<line x1="24.00" y1="39.00" x2="716.00" y2="39.00" stroke="#d5dcda" stroke-width="1" opacity="1"/>
<text x="28.00" y="67.00" fill="#235969" font-size="10" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">VOLUME 1 · CENTERED RESIDUAL</text>
<text x="28.00" y="99.00" fill="#172126" font-size="11" font-weight="600" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">e − μ</text>
