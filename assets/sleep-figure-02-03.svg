<polygon points="548.00,87.00 550.99,91.01 545.01,91.01" fill="#5a6669"/>
<text x="704.00" y="161.00" fill="#315f82" font-size="11" font-weight="700" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">PC 1</text>
