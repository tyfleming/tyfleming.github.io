<svg xmlns="http://www.w3.org/2000/svg" width="740" height="300" viewBox="0 0 740 300" role="img" aria-labelledby="title desc">
<title id="title">Projecting a residual pattern onto learned PCA components</title>
<desc id="desc">Illustrative PCA projection. The first volume's residual vector [3, 1, minus 2, minus 2] minus training reference [1, minus 1, 0, 0] is [2, 2, minus 2, minus 2]. Its dot product with principal component one [0.5, 0.5, minus 0.5, minus 0.5] is 4, and with principal component two [0.5, minus 0.5, 0.5, minus 0.5] is zero. The score plot shows four training volumes at [4, 0], [minus 4, 0], [0, 2], and [0, minus 2].</desc>
<rect width="740" height="300" fill="#ffffff"/>
<text x="24.00" y="27.00" fill="#235969" font-size="11" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">FIGURE 02.3 / PROJECT ONE VOLUME</text>
<text x="716.00" y="27.00" fill="#5a6669" font-size="11" font-weight="400" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">illustrative · the fitted basis is now fixed</text>
<line x1="24.00" y1="39.00" x2="716.00" y2="39.00" stroke="#d5dcda" stroke-width="1" opacity="1"/>
<text x="28.00" y="68.00" fill="#235969" font-size="10" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">ONE RESIDUAL PATTERN</text>
<text x="28.00" y="97.00" fill="#172126" font-size="12" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">e = (3, 1, −2, −2)</text>
<text x="28.00" y="125.00" fill="#172126" font-size="12" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">μ = (1, −1, 0, 0)</text>
<line x1="28.00" y1="137.00" x2="302.00" y2="137.00" stroke="#d5dcda" stroke-width="1" opacity="1"/>
<text x="28.00" y="161.00" fill="#172126" font-size="12" font-weight="600" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">e − μ = (2, 2, −2, −2)</text>
<text x="28.00" y="193.00" fill="#315f82" font-size="11" font-weight="600" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">PC 1 · centered pattern</text>
<text x="28.00" y="212.00" fill="#172126" font-size="12" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">½(2 + 2 + 2 + 2) = +4</text>
<text x="28.00" y="239.00" fill="#ad673d" font-size="12" font-weight="600" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">PC 2:  ½(2 − 2 − 2 + 2) = 0</text>
<line x1="337.00" y1="56.00" x2="337.00" y2="249.00" stroke="#d5dcda" stroke-width="1" opacity="1"/>
<text x="364.00" y="68.00" fill="#235969" font-size="10" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">TWO SCORES PER VOLUME</text>
<line x1="374.00" y1="164.00" x2="695.00" y2="164.00" stroke="#d5dcda" stroke-width="1.3" opacity="1"/>
<line x1="537.00" y1="79.00" x2="537.00" y2="245.00" stroke="#d5dcda" stroke-width="1.3" opacity="1"/>
<text x="696.00" y="155.00" fill="#315f82" font-size="11" font-weight="600" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">PC 1</text>
<text x="460.00" y="89.00" fill="#ad673d" font-size="11" font-weight="600" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">PC 2</text>
<circle cx="685.00" cy="164.00" r="6.00" fill="#235969" stroke="#235969" stroke-width="1.6"/>
<text x="677.00" y="183.00" fill="#172126" font-size="10" font-weight="600" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">v1 (+4, +0)</text>
<circle cx="389.00" cy="164.00" r="6.00" fill="#ffffff" stroke="#235969" stroke-width="1.6"/>
<text x="399.00" y="183.00" fill="#172126" font-size="10" font-weight="600" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">v2 (-4, +0)</text>
<circle cx="537.00" cy="92.00" r="6.00" fill="#ffffff" stroke="#235969" stroke-width="1.6"/>
<text x="549.00" y="109.00" fill="#172126" font-size="10" font-weight="600" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">v3 (+0, +2)</text>
<circle cx="537.00" cy="236.00" r="6.00" fill="#ffffff" stroke="#235969" stroke-width="1.6"/>
<text x="549.00" y="240.00" fill="#172126" font-size="10" font-weight="600" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">v4 (+0, -2)</text>
<line x1="24.00" y1="260.00" x2="716.00" y2="260.00" stroke="#d5dcda" stroke-width="1" opacity="1"/>
<text x="24.00" y="283.00" fill="#5a6669" font-size="11" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">A score is a dot product with one fitted component; each volume yields two coordinates.</text>
</svg>
