<svg xmlns="http://www.w3.org/2000/svg" width="240" height="190" viewBox="0 0 240 190" role="img" aria-labelledby="title desc">
  <title id="title">Layered brain slices</title>
  <desc id="desc">Four abstract cortical cross sections settle into a layered three-dimensional form.</desc>
  <style>
    .arrive{animation:assemble .85s cubic-bezier(.2,.7,.2,1) both}
    .one{animation-delay:0s}.two{animation-delay:.08s}.three{animation-delay:.16s}.four{animation-delay:.24s}
    @keyframes assemble{from{opacity:0;transform:translate(12px,-7px)}to{opacity:1;transform:translate(0,0)}}
    @media(prefers-reduced-motion:reduce){.arrive{animation:none}}
  </style>
  <defs>
    <path id="outline" d="M109 26 C89 20 66 29 51 45 C34 46 23 62 28 79 C17 91 24 111 38 118 C40 136 60 148 77 144 C87 152 99 151 109 143 C119 151 132 152 142 144 C159 148 179 136 181 118 C195 111 202 91 191 79 C196 62 185 46 168 45 C153 29 130 20 110 26 Z"/>
    <path id="midline" d="M109 27 C102 44 111 55 108 69 C105 81 110 89 108 100 C105 113 110 129 109 143"/>
    <path id="folds" d="M48 62 C61 55 68 66 79 59 C87 54 94 56 100 63 M37 84 C51 76 60 87 69 81 C78 74 89 78 96 85 M45 107 C58 99 67 109 77 104 C84 99 93 102 98 111 M64 129 C76 121 86 128 99 123 M170 62 C157 55 150 66 139 59 C131 54 124 56 118 63 M181 84 C167 76 158 87 149 81 C140 74 129 78 122 85 M173 107 C160 99 151 109 141 104 C134 99 125 102 120 111 M154 129 C142 121 132 128 119 123"/>
    <path id="ventricles" d="M107 89 C96 80 85 83 80 90 C89 95 98 96 107 91 M111 89 C122 80 133 83 138 90 C129 95 120 96 111 91"/>
  </defs>
  <path d="M11 161 H226" fill="none" stroke="#d3ddd8" stroke-width="1"/>
  <g transform="translate(20,-12)"><g class="arrive one" fill="#e4ebe6" stroke="#b7c9c2" stroke-width="1.2"><use href="#outline"/></g></g>
  <g transform="translate(13,-8)"><g class="arrive two" fill="#edf2ec" stroke="#a9c0b7" stroke-width="1.2"><use href="#outline"/></g></g>
  <g transform="translate(6,-4)"><g class="arrive three" fill="#f3f5f0" stroke="#8ca99f" stroke-width="1.2"><use href="#outline"/></g></g>
  <g class="arrive four">
    <use href="#outline" fill="#f8f8f5" stroke="#245d5b" stroke-width="1.8"/>
    <use href="#folds" fill="none" stroke="#8ca99f" stroke-width="1.25" stroke-linecap="round"/>
    <use href="#midline" fill="none" stroke="#245d5b" stroke-width="1.25"/>
    <use href="#ventricles" fill="#d4e2da" stroke="#a66c50" stroke-width="1"/>
  </g>
  <path d="M11 161 v5 M226 161 v5" stroke="#a66c50" stroke-width="1.5"/>
  <text x="11" y="182" fill="#586866" font-family="Arial,sans-serif" font-size="9" letter-spacing="1.5">CORTEX / LAYERED VIEW</text>
</svg>
