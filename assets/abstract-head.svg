<svg xmlns="http://www.w3.org/2000/svg" width="240" height="190" viewBox="0 0 240 190" role="img" aria-labelledby="title desc">
  <title id="title">Abstract head geometry</title>
  <desc id="desc">A side-profile head formed from four offset contours and a sparse curved coordinate mesh.</desc>
  <style>
    .plane{animation:settle .8s cubic-bezier(.2,.7,.2,1) both}
    .p1{animation-delay:0s}.p2{animation-delay:.07s}.p3{animation-delay:.14s}.p4{animation-delay:.21s}
    @keyframes settle{from{opacity:0;transform:translate(-9px,5px)}to{opacity:1;transform:translate(0,0)}}
    @media(prefers-reduced-motion:reduce){.plane{animation:none}}
  </style>
  <defs>
    <path id="head" d="M130 18 C98 13 70 29 57 56 C45 81 49 109 65 130 C74 142 88 149 105 150 L108 176 H156 L153 145 C163 137 168 125 166 113 Q174 105 169 100 L178 97 Q185 94 183 91 L169 78 C172 59 167 41 151 27 C143 21 136 19 130 18 Z"/>
    <clipPath id="inside"><use href="#head"/></clipPath>
  </defs>
  <g transform="translate(-18,-6)"><g class="plane p1"><use href="#head" fill="#e7eee9" stroke="#bdcec5" stroke-width="1.15"/></g></g>
  <g transform="translate(-12,-4)"><g class="plane p2"><use href="#head" fill="#edf2ed" stroke="#a8c0b5" stroke-width="1.15"/></g></g>
  <g transform="translate(-6,-2)"><g class="plane p3"><use href="#head" fill="#f3f5f0" stroke="#8aa99c" stroke-width="1.15"/></g></g>
  <g class="plane p4">
    <use href="#head" fill="#f8f8f5" stroke="#245d5b" stroke-width="1.8"/>
    <g clip-path="url(#inside)" fill="none" stroke="#9bb6a9" stroke-width="1">
      <path d="M68 29 C91 64 100 107 85 157 M94 18 C115 60 121 112 106 158 M123 17 C141 56 143 106 133 153 M151 26 C160 58 158 110 151 148"/>
      <path d="M49 59 C85 49 137 58 174 78 M48 85 C86 78 138 84 184 90 M54 111 C92 107 135 110 174 107 M70 136 C99 127 133 132 161 132"/>
    </g>
    <path d="M61 58 92 83 117 59 143 84 169 77 M55 111 87 136 111 109 135 132 167 112" fill="none" stroke="#245d5b" stroke-width=".8" opacity=".55"/>
    <circle cx="117" cy="59" r="2.3" fill="#a66c50"/>
    <circle cx="135" cy="132" r="2.3" fill="#a66c50"/>
  </g>
</svg>
