<title id="title">Shrinkage connectivity from a short window</title>
<desc id="desc">Six selected features from the full 39-feature operation show sample covariance, reconstructed Ledoit-Wolf shrinkage covariance, and final correlation. Rows are Auditory, Default, and Visual means, Auditory and Default residual PC1, and Default residual PC2. The saved shrinkage fraction for this window is 0.1511; eigenvalue flooring made no change.</desc>
