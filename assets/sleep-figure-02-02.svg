<svg xmlns="http://www.w3.org/2000/svg" width="740" height="300" viewBox="0 0 740 300" role="img" aria-labelledby="title desc">
<title id="title">Default-network residual modes</title>
<desc id="desc">The Default community contains 41 of the Gordon atlas's 333 cortical parcels. Each of its 41 parcel rows has a loading on each of two fold-trained residual principal components, so the basis is 41 by 2. Six numeric rows and all 41 heatmap rows are shown. Three reconstructed standardized held-out traces show its network mean and two residual scores across 30 frames.</desc>
