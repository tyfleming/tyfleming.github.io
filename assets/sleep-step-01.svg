<title id="title">Overlapping causal fMRI windows</title>
<desc id="desc">A schematic 35-volume timeline shows two 30-volume windows at endpoints five volumes apart. Below it, three reconstructed standardized network means and a motion-validity strip show the current representative window. The endpoint sleep label is not an input.</desc>
